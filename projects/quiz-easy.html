<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Легкий уровень — Тест</title>
    <link rel="stylesheet" href="quiz-style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Небольшие дополнительные стили для формы тестов */
        .quiz-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 30px;
        }

        .test-q-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
        }

        .test-q-box p {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #4cc9f0;
        }

        .radio-option {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #cfd8dc;
        }

        .radio-option input {
            margin-right: 10px;
        }

        .submit-btn {
            background: #4cc9f0;
            color: #02040a;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #ffffff;
            box-shadow: 0 0 20px #ffffff;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="quiz.html" class="back-link">← Назад к уровням</a>
        <div class="logo">🟢 Легкий уровень</div>
    </header>

    <main class="quiz-container">
        <div class="question-box">
            <h1 style="color: #4cc9f0; margin-bottom: 5px;">Погружение началось!</h1>
            <p style="color: #b0bec5; font-style: italic; font-weight: 300; margin-bottom: 20px;">«Тут всё слишком
                просто для тебя!»</p>

            <form class="quiz-form" id="easy-form">
                <!-- Вопрос 1 -->
                <div class="test-q-box">
                    <p>1. Какое животное является самым крупным дельфином планеты?</p>
                    <label class="radio-option"><input type="radio" name="q1" value="0"> Афалина</label>
                    <label class="radio-option"><input type="radio" name="q1" value="1"> Косатка</label>
                    <label class="radio-option"><input type="radio" name="q1" value="2"> Синий кит</label>
                </div>

                <!-- Вопрос 2 -->
                <div class="test-q-box">
                    <p>2. Что принимают морские черепахи за медуз и трагически погибают?</p>
                    <label class="radio-option"><input type="radio" name="q1" value="0"> Морские водоросли</label>
                    <label class="radio-option"><input type="radio" name="q2" value="1"> Пластиковые пакеты</label>
                    <label class="radio-option"><input type="radio" name="q2" value="2"> Корабли</label>
                </div>

                <!-- Вопрос 3 -->
                <div class="test-q-box">
                    <p>3. Как спят дельфины Афалины?</p>
                    <label class="radio-option"><input type="radio" name="q3" value="0"> Спят на самом дне</label>
                    <label class="radio-option"><input type="radio" name="q3" value="1"> Половинки мозга спят по
                        очереди</label>
                    <label class="radio-option"><input type="radio" name="q3" value="2"> Они вообще никогда не
                        спят</label>
                </div>

                <button type="button" onclick="checkAnswers()" class="submit-btn">Завершить тест и проверить результаты
                    🔱</button>
            </form>
        </div>
    </main>

    <script>
        function checkAnswers() {
            const form = document.getElementById('easy-form');
            let score = 0;

            // Проверяем вопрос 1 (правильный индекс 1 — Косатка)
            const q1 = form.querySelector('input[name="q1"]:checked');
            if (q1 && q1.value === "1") score++;

            // Проверяем вопрос 2 (правильный индекс 1 — Пакеты)
            const q2 = form.querySelector('input[name="q2"]:checked');
            if (q2 && q2.value === "1") score++;

            // Проверяем вопрос 3 (правильный индекс 1 — Мозг)
            const q3 = form.querySelector('input[name="q3"]:checked');
            if (q3 && q3.value === "1") score++;

            // Условие победы (минимум 2 правильных ответа из 3)
            if (score >= 2) {
                alert("Ура! Тест пройден. Вы ответили правильно на " + score + " из 3 вопросов! Средний уровень разблокирован.");
                localStorage.setItem('quiz_easy_passed', 'true');

                // Перенаправляем игрока обратно на карту уровней
                window.location.href = "quiz.html";
            } else {
                alert("Глубина не взята... Вы ответили правильно всего на " + score + " из 3 вопросов. Наберите хотя бы 2 балла. Попробуйте ещё раз!");
            }
        }
    </script>
</body>

</html>
